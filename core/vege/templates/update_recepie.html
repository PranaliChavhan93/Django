<!DOCTYPE html>
<html>
<head>
    <title>Update Recipe</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-5">
    <div class="row">
        <div class="col-15">
            <form class="col-6 mx-auto card p-3 shadow-lg" method="post" enctype="multipart/form-data">
                
                <h2>Update Recipe</h2>
                <hr>

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Recipe name</label>
                    <input type="text" value="{{recepie.recp_name}}" name="recp_name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Recipe Description</label>
                    <textarea name="recp_desc" class="form-control" rows="4" required>{{recepie.recp_desc}}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Recipe Image</label>
                    <input type="file" name="recp_imag" class="form-control">
                </div>

                <button type="submit" class="btn btn-success">Update Recipe</button>

            </form>

            <br><br>

        </div>
    </div>

</div>

</body>
</html>
