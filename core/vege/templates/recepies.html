<!DOCTYPE html>
<html>
<head>
    <title>Add Recipe</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-5">
    <div class="row">
        <div class="col-15">
            <form class="col-6 mx-auto card p-3 shadow-lg" method="post" enctype="multipart/form-data">
                
                <h2>Add Recipe</h2>
                <hr>

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Recipe name</label>
                    <input type="text" name="recp_name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Recipe Description</label>
                    <textarea name="recp_desc" class="form-control" rows="4" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Recipe Image</label>
                    <input type="file" name="recp_imag" class="form-control">
                </div>

                <button type="submit" class="btn btn-success">Add Recipe</button>

            </form>

            <hr>

            <div class="mt-5">
                <div class="mx-auto col-6">

                <form>
                    <div class="mb-3">
                        <label class="form-label">Search Recipe</label>
                        <input type="text" name="search" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
                </div>
            </div>


            <table class="table mt-5">
                <thead>
                    <tr>
                    <th scope="col">#</th>
                    <th scope="col">Recipe Name</th>
                    <th scope="col">Recipe Description</th>
                    <th scope="col">Recipe Image</th>
                    <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for receipe in recepies %}
                    <tr>
                    <th scope="row">{{ forloop.counter }}</th>
                    <td>{{ receipe.recp_name }}</td>
                    <td>{{ receipe.recp_desc }}</td>
                    <td class="text-center">
                        <img src= "/media/{{ receipe.recp_imag }}" style="width:100%; height:100%; object-fit:cover;">
                        <td>
                            <a href="/delete_recepie/{{receipe.id}}/" class="btn btn-danger m-2">Delete</a>
                       
                            <a href="/update_recepie/{{receipe.id}}/" class="btn btn-success">Update</a>
                        </td>
                    </td>    
                    </tr>
                    {% endfor %}

                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
